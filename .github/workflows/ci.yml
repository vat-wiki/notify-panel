name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # 必须在 Typecheck/Test 前:extensions/tui 的 typecheck/test 引用主包的
        # dist/(notify-panel/sdk),不先 build 主包,tsc/vitest 都找不到。
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
